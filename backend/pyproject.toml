[project]
name = "gestao-pessoal-api"
version = "0.1.0"
description = "API central do Sistema de Gestão Pessoal (FastAPI)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "PyJWT[crypto]>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error",
    # Starlette 1.x recomenda `httpx2` no TestClient; mantido `httpx` até avaliação.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# SQL montado só com constantes do módulo e cláusulas fixas; valores sempre parametrizados (%s).
"app/db/repos/**" = ["S608"]
